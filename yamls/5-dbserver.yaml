kind: Pod
apiVersion: v1
metadata:
  name: ${SERVER_PREFIX}db-server
  labels:
    app: ${SERVER_PREFIX}db-server
spec:
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    volumes:
    - name: ${SERVER_PREFIX}minikube-vol
      persistentVolumeClaim:
        claimName: ${SERVER_PREFIX}minikube-pvc

    restartPolicy: Always
    containers:
      - name: postgres
        volumeMounts:
          - mountPath: "/var/lib/postgresql/data"
            name: ${SERVER_PREFIX}minikube-vol
        ports:
          - containerPort: 5432
            name: "port-5432"
        image: opentaproject/db-server:${OPENTA_PG_TAG}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        # PID 1 is supervisord, so startup/liveness must track supervisord, not postgres.
        # Otherwise `supervisorctl stop postgres` would fail liveness and restart the pod.
        startupProbe:
          exec:
            command: ["supervisorctl", "pid"]
          periodSeconds: 5
          failureThreshold: 12
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: ["supervisorctl", "pid"]
          periodSeconds: 10
          timeoutSeconds: 5
        # Readiness still tracks postgres, so a stopped server is pulled out of the Service.
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5

        env:
        - name: BACKUP_INTERVAL
          value: "${BACKUP_INTERVAL}"  # minutes between online base backups; 0 disables
        - name: DB_GENERATIONS
          value: "${DB_GENERATIONS}"   # round-robin backup slots: 0..DB_GENERATIONS-1
        - name: DOMAIN_NAME
          value: "${DOMAIN_NAME}"      # recorded in each backup's 'latest' sentinel
        - name: POSTGRES_ARGS
          value: "-c max_connections=200 -c superuser_reserved_connections=5"
        - name: TZ
          value: "Europe/Stockholm" # Set your desired timezone
        - name: PGDATA
          value: "/var/lib/postgresql/data/db18"
        - name: POSTGRES_PASSWORD
          value: ${PGPASSWORD}
        - name: POSTGRES_USER
          value: ${PGUSER}
        - name: POSTGRES_DEFAULT_DB
          value: ${POSTGRES_DEFAULT_DB}
---
apiVersion: v1
kind: Service
metadata:
  name: ${SERVER_PREFIX}db-server
  labels:
    run: ${SERVER_PREFIX}db-server
spec:
  type: NodePort
  ports:
    - name: "port-5432"
      protocol: TCP
      port: 5432 
      targetPort: 5432


  selector:
    app: ${SERVER_PREFIX}db-server
