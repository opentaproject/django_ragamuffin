{% load static %}
<html>
<head>
  <link rel="stylesheet" href="{% static 'django_ragamuffin/styles.css' %}">
</head>
<body class="ragamuffin-page upload-page">
<form id="upload-form" method="POST" enctype="multipart/form-data">
  {% csrf_token %}
  <input id="upload-files" type="file" name="myfile" multiple required>
  <button id="upload-button" type="submit">Upload File</button>
</form>
<div id="upload-progress-container" hidden>
  <progress id="upload-progress" value="0" max="1"></progress>
  <span id="upload-progress-text" aria-live="polite"></span>
</div>
{% if file_url %}
  <p>Uploaded file: <a href="{{ file_url }}">{{ file_url }}</a></p>
{% endif %}
<script src="{% static 'django_ragamuffin/batch-progress.js' %}"></script>
<script>
  setupBatchProgress({
    formId: "upload-form",
    itemType: "files",
    itemSelector: "#upload-files",
    controlsSelector: "#upload-files, #upload-button",
    idField: "upload_id",
    statusPath: "status",
    progressContainerId: "upload-progress-container",
    progressId: "upload-progress",
    progressTextId: "upload-progress-text",
    operationName: "upload",
    failureReportField: "upload_client_failure",
  });
</script>
</body>
</html>
