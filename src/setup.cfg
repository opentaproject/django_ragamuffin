[metadata]
name = django_ragamuffin
version = 3.6.0.9
description = OpenAI-backed document retrieval and conversational querying for Django
long_description = file: README.md
long_description_content_type = text/markdown
author = Stellan Östlund
author_email = stellan.ostlund@gmail.com
url = https://github.com/opentaproject/django_ragamuffin
license = MIT License
license_files = LICENSE
classifiers =
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 5.2
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3

[options]
packages = find:
include_package_data = true
install_requires =
    Django>=5.2.17,<6.1
    openai>=3.6.0
python_requires = >=3.11

[options.packages.find]
# You can restrict discovery here if needed, e.g.:
# include = django_ragamuffin*
