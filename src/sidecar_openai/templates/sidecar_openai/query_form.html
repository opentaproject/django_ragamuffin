<!DOCTYPE html>
<html>
<head>
    <title>Query Interface</title>
</head>
<body>
    <h1>Enter Your Query</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
    </form>

    {% if response %}
        <h2>Response:</h2>
        <p>{{ response }}</p>
    {% endif %}
</body>
</html>
